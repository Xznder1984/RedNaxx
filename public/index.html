<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RedNax - Share Your Videos</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">RedNax</div>
            <div class="nav-buttons" id="navButtons">
                <button class="btn btn-primary" id="uploadBtn">Upload</button>
                <button class="btn btn-secondary" id="loginBtn">Login</button>
            </div>
            <div class="user-menu" id="userMenu" style="display: none;">
                <span class="username" id="usernameDisplay"></span>
                <button class="btn btn-primary" id="uploadBtnAuth">Upload</button>
                <button class="btn btn-secondary" id="logoutBtn">Logout</button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container">
        <div class="video-grid" id="videoGrid">
            <!-- Videos will be loaded here -->
        </div>
    </main>

    <!-- Login Modal -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <span class="close" id="closeLogin">&times;</span>
            <h2>Login to RedNax</h2>
            <form id="loginForm">
                <input type="email" id="loginEmail" placeholder="Email" required>
                <input type="password" id="loginPassword" placeholder="Password" required>
                <button type="submit" class="btn btn-primary btn-full">Login</button>
            </form>
            <p class="form-footer">
                Don't have an account? <a href="#" id="showSignup">Sign up</a>
            </p>
        </div>
    </div>

    <!-- Signup Modal -->
    <div class="modal" id="signupModal">
        <div class="modal-content">
            <span class="close" id="closeSignup">&times;</span>
            <h2>Sign Up for RedNax</h2>
            <form id="signupForm">
                <input type="text" id="signupUsername" placeholder="Username" required>
                <input type="email" id="signupEmail" placeholder="Email" required>
                <input type="password" id="signupPassword" placeholder="Password" required>
                <button type="submit" class="btn btn-primary btn-full">Sign Up</button>
            </form>
            <p class="form-footer">
                Already have an account? <a href="#" id="showLogin">Login</a>
            </p>
        </div>
    </div>

    <!-- Upload Modal -->
    <div class="modal" id="uploadModal">
        <div class="modal-content">
            <span class="close" id="closeUpload">&times;</span>
            <h2>Upload Video</h2>
            <form id="uploadForm" enctype="multipart/form-data">
                <input type="text" id="videoTitle" placeholder="Video Title" required>
                <textarea id="videoDescription" placeholder="Description (optional)" rows="4"></textarea>
                <div class="file-input-container">
                    <input type="file" id="videoFile" accept="video/*" required>
                    <label for="videoFile" class="file-label">Choose Video File</label>
                    <span class="file-name" id="fileName">No file chosen</span>
                </div>
                <div class="upload-progress" id="uploadProgress" style="display: none;">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <span class="progress-text" id="progressText">0%</span>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Upload</button>
            </form>
        </div>
    </div>

    <!-- Video Player Modal -->
    <div class="modal" id="videoModal">
        <div class="modal-content video-modal-content">
            <span class="close" id="closeVideo">&times;</span>
            <div class="video-player-container">
                <video id="videoPlayer" controls></video>
                <div class="video-info">
                    <h2 id="videoTitle"></h2>
                    <div class="video-meta">
                        <span id="videoUsername"></span>
                        <span id="videoViews"></span>
                        <span id="videoDate"></span>
                    </div>
                    <p id="videoDescription"></p>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
